[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.10"
files = [
    "main.py",
    "models.py",
    "services.py",
    "storage.py",
    "ui.py",
    "sqlite_storage.py",
]
strict = true